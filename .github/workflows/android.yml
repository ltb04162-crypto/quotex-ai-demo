
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuotexAI_Free_Demo_Android.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o QuotexAI_Free_Demo_Android.zip -d project

      - name: Fix Java version
        run: |
          APP_GRADLE=$(find project -path '*/app/build.gradle.kts' -print -quit)
          test -n "$APP_GRADLE"
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$APP_GRADLE"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotexAI-Demo-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
